name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # The server tests start a real `hermes serve`, so CI runs the checks that need no Hermes: typecheck, design lint, web tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -p server --noEmit
      - run: npx tsc -p web --noEmit
      - run: npm run lint:ui
      - run: npm run test:web
