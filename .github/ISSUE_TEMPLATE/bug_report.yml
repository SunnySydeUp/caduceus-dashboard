name: Bug report
description: Something in Caduceus does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems: do not file them here. See SECURITY.md and report privately.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
    validations:
      required: true
  - type: textarea
    id: facts
    attributes:
      label: Install facts
      description: In Caduceus, Control › System › Maintenance › Diagnostics › Copy for bug report, then paste here. Check it for anything private first.
      render: text
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari 26 (installed app) / macOS, Chrome 140
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: Relevant lines from ~/.hermes/caduceus/logs/caduceus.log, with secrets removed.
      render: text
